# Locais de pouso analisados pela ferramenta.
#
# ATENÇÃO: as coordenadas abaixo são APROXIMADAS (centros de crateras /
# pontos de referência genéricos) e DEVEM ser verificadas depois contra
# fontes oficiais (IAU/USGS Gazetteer, listas de regiões candidatas do
# Artemis, produtos do LOLA). Malapert, por exemplo, tem mais de um ponto
# de referência (o pico do maciço e a região candidata "Malapert Massif").
#
# Convenções (contrato de dados):
#   lat: graus, negativa no hemisfério sul
#   lon: graus, LESTE positiva (-180..180)
#   id:  minúsculo, sem espaços; vira nome de arquivo em data/horizon e data/sky

sites:
